<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Enclosing dashed target box -->
  <rect x="3" y="3" width="18" height="18" rx="1" stroke-dasharray="3 3"/>
  <!-- Small solid source box in lower left -->
  <rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor" fill-opacity="0.1"/>
  <!-- Diagonal extending arrow -->
  <line x1="10" y1="14" x2="21" y2="3"/>
  <!-- Arrow tip snapping to top-right -->
  <polyline points="16 3 21 3 21 8"/>
</svg>
