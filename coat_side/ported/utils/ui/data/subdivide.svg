<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer square -->
  <rect x="3" y="3" width="16" height="16" rx="1"/>
  <!-- Vertical divider -->
  <line x1="11" y1="3" x2="11" y2="19"/>
  <!-- Horizontal divider (bottom-right quadrant only) -->
  <line x1="11" y1="11" x2="19" y2="11"/>
  <!-- Vertical sub-divider in bottom-right -->
  <line x1="15" y1="11" x2="15" y2="19"/>
</svg>
