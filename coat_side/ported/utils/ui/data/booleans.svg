<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Circle: cx=9,r=7 -> spans x=2..16, with stroke to x=1..17 (safe) -->
  <circle cx="9" cy="9" r="7"/>
  <!-- Rect: x=9,w=11 -> spans x=9..20, with stroke to x=8..21 (safe) -->
  <rect x="9" y="9" width="11" height="11" rx="1"/>
</svg>
